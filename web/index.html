<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إنجاز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--pri:#0e5a4b;--pri2:#14806a;--pri3:#e6f2ef;--gold:#b8913a;--gold2:#f6efdf;--bg:#f3f5f4;--card:#fff;--tx:#1b2a27;--mu:#66756f;--ln:#e1e7e5;--ok:#1d8a55;--okb:#e3f4ea;--bad:#c0392b;--badb:#fbe9e7;--warn:#b7791f;--warnb:#fdf3e1;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;flex:none}
.brand b{font-size:20px;font-weight:800;letter-spacing:.3px}
.brand small{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#9ad;display:inline-block}
.dot.ok{background:#5be39b}.dot.local{background:#f5c062}.dot.err{background:#ff7b6b}
main{max-width:1180px;margin:0 auto;padding:16px 14px 80px}
.hero{background:linear-gradient(135deg,var(--pri) 0%,var(--pri2) 100%);color:#fff;border-radius:20px;padding:22px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.07)}
.hero .day{font-size:30px;font-weight:800}
.hero .dates{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.hero .dates div{background:rgba(255,255,255,.13);border-radius:12px;padding:8px 14px}
.hero .dates small{display:block;font-size:12px;opacity:.8}
.hero .dates b{font-size:17px}
.hero .clock{position:absolute;left:22px;bottom:18px;font-size:26px;font-weight:700;opacity:.9;direction:ltr}
.hero .greet{opacity:.9;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.tile{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px 12px;text-align:center;cursor:pointer;position:relative;transition:transform .12s,box-shadow .12s;text-decoration:none;color:var(--tx)}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(14,90,75,.12)}
.tile .ic{width:54px;height:54px;border-radius:16px;margin:0 auto 8px;display:grid;place-items:center;background:var(--pri3);color:var(--pri)}
.tile .ic svg{width:28px;height:28px}
.tile b{display:block;font-size:14.5px;line-height:1.4}
.tile .badge{position:absolute;top:10px;left:10px;background:var(--gold);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px;font-weight:700}
.pghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.pghead h1{font-size:22px;margin:0;font-weight:800;color:var(--pri)}
.pghead .sp{flex:1}
.back{border:none;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:6px 10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:16px;color:var(--pri)}
.btn{border:none;background:var(--pri);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--pri2)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent;color:var(--pri);border:1px dashed var(--pri2)}
.btn.ghost:hover{background:var(--pri3)}
.btn.line{background:#fff;color:var(--pri);border:1px solid var(--ln)}
.btn.gold{background:var(--gold)}
.btn.red{background:var(--bad)}
.btn.wa{background:#1fa855}.btn.wa:hover{background:#178a45}
.ib{border:none;background:transparent;cursor:pointer;padding:3px 5px;border-radius:6px;color:var(--mu);font-size:14px}
.ib:hover{background:var(--pri3);color:var(--pri)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:thin}
.tab{border:1px solid var(--ln);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--mu)}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:right;vertical-align:middle}
th{background:#f7faf9;color:var(--pri);font-weight:700;white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:none}
td .dt{white-space:nowrap}
.tw td:first-child{min-width:110px}
.dt small{display:block;color:var(--mu);font-size:11.5px}
.st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.st.ok{background:var(--okb);color:var(--ok)}.st.no{background:var(--badb);color:var(--bad)}.st.na{background:#eef1f0;color:var(--mu)}.st.warn{background:var(--warnb);color:var(--warn)}
.lvl{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bar{height:7px;border-radius:9px;background:#e8eeec;overflow:hidden;min-width:60px;flex:1}
.bar i{display:block;height:100%;background:var(--pri2);border-radius:9px}
.muted{color:var(--mu)}
.small{font-size:12.5px}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px}
.kpi small{color:var(--mu);display:block;font-size:12.5px}
.kpi b{font-size:22px;color:var(--pri)}
.kpi.g b{color:var(--gold)}.kpi.r b{color:var(--bad)}.kpi.o b{color:var(--ok)}
.acc{background:#fff;border:1px solid var(--ln);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;font-weight:700}
.acc-h .t{flex:1}
.acc-h .chev{transition:transform .15s;color:var(--mu)}
.acc.open .acc-h{background:var(--pri3)}
.acc.open .chev{transform:rotate(-90deg)}
.acc-b{padding:12px 14px}
.node{border-right:3px solid var(--pri2);padding:6px 12px 6px 4px;margin:8px 0}
.node.d1{border-color:var(--gold)}.node.d2{border-color:#7fb3a7}.node.d3{border-color:#c9b98a}
.node-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.node-h .lbl{color:var(--mu);font-size:12.5px}
.node-h .tx{font-weight:700;flex:1;min-width:140px}
.node-b{padding-right:10px}
.fld input.dtx{font-weight:700;letter-spacing:.3px}
.fld input[type=date]{color:var(--mu);font-size:13px;padding:5px 8px}
.sheet.wide{max-width:920px;height:94vh}.evview{min-height:200px}.pdfpg{display:block;margin:0 auto 10px;box-shadow:0 1px 6px rgba(0,0,0,.18);border-radius:4px;background:#fff}
table.achT>tbody>tr>td:first-child,table.achT>thead>tr>th:first-child{min-width:0;width:22px;padding-left:2px;padding-right:6px;color:var(--mu)}table.achT td[colspan]{min-width:0!important}
.filebtn{position:relative;overflow:hidden;cursor:pointer}.fileinp{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
#tgT{min-width:560px}#tgT td{padding:5px 6px}#tgT td:first-child{min-width:0;width:26px;color:var(--mu)}#tgT .tg-n{min-width:170px}#tgT .tg-s{min-width:120px}#tgT .tg-p{min-width:130px}
.code{background:var(--pri);color:#fff;border-radius:7px;padding:1px 9px;font-size:12.5px;font-weight:700;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.tag{background:var(--gold2);color:#7a5d17;border-radius:8px;padding:1px 8px;font-size:12px;white-space:nowrap}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meta-grid .full{grid-column:1/-1}
.meta-box{background:#f8fbfa;border:1px solid var(--ln);border-radius:12px;padding:12px}
.meta-box h4{margin:0 0 6px;color:var(--gold);font-size:14px}
.meta-box ul{margin:0;padding-right:18px}
.flt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.flt select,.flt input{border:1px solid var(--ln);border-radius:9px;padding:6px 8px;background:#fff}
.modal{position:fixed;inset:0;background:rgba(16,30,27,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center}}
.modal.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0}
@media(min-width:700px){.sheet{border-radius:18px}}
.sheet-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--ln)}
.sheet-h h3{margin:0;flex:1;font-size:17px;color:var(--pri)}
.sheet-h button{border:none;background:none;font-size:24px;cursor:pointer;color:var(--mu)}
#mBody{padding:16px 18px;overflow:auto}
#mFoot{padding:12px 18px;border-top:1px solid var(--ln);display:flex;gap:8px;flex-wrap:wrap}
#mFoot:empty{display:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;color:var(--mu);font-weight:600}
.fld input,.fld select,.fld textarea,.inp{border:1px solid #cfd9d6;border-radius:10px;padding:8px 10px;background:#fff;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:2px solid var(--pri3);border-color:var(--pri2)}
.ev{display:flex;flex-direction:column;gap:6px}
.evi{display:flex;align-items:center;gap:8px;background:#f6f9f8;border:1px solid var(--ln);border-radius:9px;padding:5px 9px;font-size:13px}
.evi span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.step{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center;cursor:pointer;position:relative}
.step .n{width:28px;height:28px;border-radius:50%;background:#eef1f0;color:var(--mu);display:grid;place-items:center;margin:0 auto 4px;font-weight:800}
.step.done{border-color:var(--ok);background:var(--okb)}
.step.done .n{background:var(--ok);color:#fff}
.step b{font-size:13px;display:block}
@media(max-width:560px){.steps{grid-template-columns:repeat(2,1fr)}.form,.meta-grid{grid-template-columns:1fr}.hero .day{font-size:26px}.hero .clock{position:static;margin-top:10px;font-size:20px}}
@media(max-width:560px){.node{padding:4px 7px 4px 0}.node-b{padding-right:2px}.acc-b{padding:10px 8px}}
.num{width:70px;border:1px solid #cfd9d6;border-radius:8px;padding:5px 6px;text-align:center}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:11px 14px;cursor:pointer}
.item:hover{border-color:var(--pri2)}
.item .t{font-weight:700}
.item .m{font-size:12.5px;color:var(--mu);display:flex;gap:10px;flex-wrap:wrap}
.src{font-size:11.5px;background:var(--pri3);color:var(--pri);border-radius:7px;padding:0 7px}
.grp{font-weight:800;color:var(--pri);margin:14px 0 6px;font-size:15px}
.owner-card{background:var(--pri3);border-radius:12px;padding:12px;margin-bottom:10px}
.top3{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.top3 .card{margin:0}
.top3 ol{margin:6px 0 0;padding-right:20px}
.chartbox{position:relative;height:240px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2a27;color:#fff;padding:10px 18px;border-radius:10px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.ro-note{background:var(--warnb);color:#7a5210;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:6px;font-size:13.5px}
.perm td,.perm th{text-align:center}
.perm td:first-child,.perm th:first-child{text-align:right}
.report h2{color:var(--pri);margin:0 0 4px}
.item.eg{border-right:5px solid var(--ok);background:var(--okb)}.item.er{border-right:5px solid var(--bad);background:var(--badb)}
tr.rg td{background:#e9f6ee}tr.rr td{background:#fcebe8}
.why{display:inline-block;background:#fff;color:var(--bad);border:1px solid #f1c3bd;border-radius:7px;padding:0 7px;font-size:11.5px;margin-left:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mu);margin:-4px 0 12px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-left:5px}
.tile .badge.red{background:var(--bad)}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px;text-align:right;background:linear-gradient(135deg,#fff,var(--gold2));border-color:#ead9b0}
.tile.wide .ic{margin:0;background:var(--gold);color:#fff}.tile.wide small{display:block;color:var(--mu);font-size:12.5px}
.dgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.dgrid>.card{margin:0}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:900px){.c4,.c6,.c8{grid-column:span 12}}
.dk{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
@media(max-width:900px){.dk{grid-template-columns:repeat(2,1fr)}}
.dk .kpi{position:relative;overflow:hidden}.dk .kpi .sub{font-size:12px;color:var(--mu)}
.dk .kpi:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--pri2)}
.dk .kpi.o:before{background:var(--ok)}.dk .kpi.r:before{background:var(--bad)}.dk .kpi.g:before{background:var(--gold)}
.pl{display:flex;flex-direction:column;gap:12px}
.pl .r1{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.pl .bar{height:10px}
.pl .bar i.g{background:var(--ok)}
.stack{display:flex;height:10px;border-radius:9px;overflow:hidden;background:#e8eeec}
.stack i{display:block;height:100%}
.mini{display:flex;flex-direction:column}
.mini>div{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:13.5px}
.mini>div:last-child{border-bottom:none}
.mini .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhead{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dhead .sp{flex:1}
.hero .dates{cursor:pointer}
.cvgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.cvgrid .card{margin:0}
@media(max-width:700px){.cvgrid{grid-template-columns:1fr}}
.cvres{margin-top:12px;background:var(--pri3);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-height:80px}
.cvres b{font-size:19px;color:var(--pri)}
.cvres small{color:var(--mu);font-size:13px}
</style>
</head>
<body>
<header class="top">
  <div class="brand" data-act="go" data-r="home"><div class="logo">إ</div><div><b>إنجاز</b><small id="hSchool">نظام متابعة الأعمال المدرسية</small></div></div>
  <div class="sp"></div>
  <div class="who"><span class="dot" id="hDot" title="حالة الحفظ"></span><span id="hUser"></span></div>
</header>
<main id="app"></main>
<datalist id="staffList"></datalist><datalist id="teacherList"></datalist>
<div id="modal" class="modal hidden"><div class="sheet"><div class="sheet-h"><h3 id="mTitle"></h3><button data-act="mClose" aria-label="إغلاق">×</button></div><div id="mBody"></div><div id="mFoot"></div></div></div>
<div id="toast"></div>
<script>window.ENJAZ_WEB=true;window.ENJAZ_READY=new Promise(function(r){window.__enjazReady=r});</script>
<script type="module" src="firebase-shim.js"></script>
<script>
"use strict";
/* ============ أساسيات ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const COLLS=['settings','staff','op_meta','op_domains','pip_domains','sup_supervisors','sup_visits','sup_lessons','sup_plc','sup_work','dis_classes','dis_days','dis_calls','circulars','awareness','safety','safety_team','sf_checks','sf_drills','sf_maint','clubs','club_progs','club_tprogs','tachieve'];
const D={};COLLS.forEach(c=>D[c]={});
const vals=c=>Object.values(D[c]||{});
let DB=null,ASSETS=null,DL=null,MODE='loading',ME=null;
const UI={open:{},tab:{},f:{},ddate:null,dtab:'today',per:'weekly',pdate:null,scope:'all',scopeV:'',up:14,tonly:false};
const ROLES={principal:'المدير',counselor:'الموجه الطلابي',activity:'رائد النشاط',admin:'إداري'};
const MODS={op:'الخطة التشغيلية',pip:'خطة تحسين الأداء المدرسي',sup:'الإشراف التربوي المقيم',dis:'الانضباط المدرسي',circ:'التعاميم',aw:'وحدة الوعي الفكري',sf:'منسق الأمن والسلامة',clubs:'الأندية',ach:'إنجازات المعلمين'};
const DEFPERMS={counselor:['dis'],activity:['op'],admin:['circ'],health:[],safety:['sf'],volunteer:[]};
const ROLE_X={health:'الموجه الصحي',safety:'منسق الأمن والسلامة',volunteer:'منسق التطوع'};
const PERM_ROLES=()=>window.ENJAZ_WEB?['counselor','activity','admin','health','safety','volunteer']:['counselor','activity','admin'];
const STAGES=['الابتدائية','المتوسطة','الثانوية'];
const PERIODS=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة'];
const LEVELS=[[25,'التهيئة'],[50,'الانطلاق'],[75,'التقدم'],[100,'التميز']];
const LVL_NAMES=LEVELS.map(x=>x[1]);
const lvlName=v=>{if(v===''||v==null)return '';v=+v;if(!v)return '';let b=LEVELS[0];LEVELS.forEach(x=>{if(Math.abs(x[0]-v)<Math.abs(b[0]-v))b=x});return b[1]};
const PIP_LEVELS=LVL_NAMES;
const VTYPES=['زيارة تشخيصية','زيارة تطويرية','زيارة تقويمية','زيارة متابعة','زيارة مفاجئة'];
const RESULTS=['تم تبرير الغياب/التأخر','تعهد بالالتزام','لا يوجد عذر','طلب حضور ولي الأمر','الرقم غير صحيح','أخرى'];

/* ============ التواريخ ============ */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>iso(new Date());
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
let fH,fHn,fG,fGn,fDay,fMon;

function weekDates(s){const d=parse(s);const st=addDays(s,-d.getDay());return [...Array(7)].map((_,i)=>addDays(st,i))}
function monthDates(s){const d=parse(s);const y=d.getFullYear(),m=d.getMonth();const n=new Date(y,m+1,0).getDate();return [...Array(n)].map((_,i)=>iso(new Date(y,m,i+1)))}

const chains={},timers={};
function writeDoc(c,id,obj){
  if(MODE==='db'){const k=c+'/'+id;chains[k]=(chains[k]||Promise.resolve()).then(()=>DB.collection(c).doc(id).set(obj)).catch(dbErr);}
  else lsSave();
}

const qPrev={};
function putQuiet(c,id,obj,delay){const k=c+'/'+id;if(!(k in qPrev))qPrev[k]=D[c][id]?clone(D[c][id]):null;obj=clone(obj);obj.id=id;D[c][id]=obj;clearTimeout(timers[k]);timers[k]=setTimeout(()=>{writeDoc(c,id,D[c][id]);logOp(qPrev[k]?'edit':'add',c,id,D[c][id],qPrev[k]);delete qPrev[k]},delay||700);}
function del(c,id){logOp('del',c,id,null,D[c][id]);delete D[c][id];if(MODE==='db'){DB.collection(c).doc(id).delete().catch(dbErr)}else lsSave();scheduleRender();}
function mutate(c,id,fn){const o=clone(D[c][id]);fn(o);put(c,id,o)}

function itemLabel(c,id,o){if(id==='backup')return 'استعادة نسخة احتياطية كاملة';if(!o)return id;if(c==='dis_days')return 'يوم '+dayName(id)+' '+greg(id);if(c==='circulars')return 'تعميم '+(o.number||'')+(o.title?': '+o.title:'');if(c==='dis_classes')return (o.stage||'')+' '+cname(o);if(c==='settings')return 'إعدادات البرنامج';if(c==='op_meta')return 'الإطار العام (الرؤية والرسالة)';if(c==='sf_drills')return 'إخلاء '+(o.num||'')+' – '+(o.stage||'');if(c==='sf_checks')return 'متابعة المبنى '+greg(o.date);return o.name||o.title||o.issue||o.student||o.teacher||o.host||id}
function diffKeys(a,b){if(!a||!b)return [];const ks=new Set([...Object.keys(a),...Object.keys(b)]);ks.delete('id');const out=[];ks.forEach(k=>{if(JSON.stringify(a[k])!==JSON.stringify(b[k]))out.push(FLD[k]||k)});return [...new Set(out)]}
function treeDetail(prev,now){/* أسماء البرامج التي تغيّرت داخل الخطة */const map=o=>{const m={};const walk=x=>{if(!x||typeof x!=='object')return;if(Array.isArray(x)){x.forEach(walk);return}if(x.programs)x.programs.forEach(p=>{m[p.id]=p});Object.values(x).forEach(v=>{if(v&&typeof v==='object')walk(v)})};walk(o);return m};
  const A=map(prev),B=map(now),out=[];Object.keys(B).forEach(id=>{if(!A[id])out.push('إضافة برنامج: '+B[id].name);else if(JSON.stringify(A[id])!==JSON.stringify(B[id])){const d=diffKeys(A[id],B[id]);out.push('تعديل «'+B[id].name+'»'+(d.length?' ('+d.join('، ')+')':''))}});Object.keys(A).forEach(id=>{if(!B[id])out.push('حذف برنامج: '+A[id].name)});return out}
function logOp(act,c,id,now,prev){
  if(NOLOG||c==='oplog'||c==='files')return;
  let det='';if(act==='edit'){if(c==='op_domains'||c==='pip_domains'){const t=treeDetail(prev,now);det=t.length?t.slice(0,4).join(' · ')+(t.length>4?' …':''):'تعديل في هيكل الخطة ('+diffKeys(prev,now).join('، ')+')'}else{const d=diffKeys(prev,now);if(!d.length)return;det='الحقول: '+d.join('، ')}}
  const o=now||prev||{},e={ts:new Date().toISOString(),act,c,did:id,sect:SECT[c]||c,item:String(itemLabel(c,id,o)).slice(0,120),det:det.slice(0,300),role:ME?roleLabel(ME):'غير مسجّل دخول',who:ME?(myName()||''):'',uid:MYUID||''};
  const lid=e.ts.replace(/[^0-9]/g,'')+'-'+uid();
  if(MODE==='db'){DB.collection('oplog').doc(lid).set(e).catch(()=>{})}else{try{const a=JSON.parse(lsGet('enjaz_oplog')||'[]');a.unshift(Object.assign({id:lid},e));lsSet('enjaz_oplog',JSON.stringify(a.slice(0,3000)))}catch(x){}}

}

const HMON=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
let fHp=null;try{fHp=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'})}catch(e){}
function g2h(dt){const o={year:0,month:1,day:1};if(!fHp)return o;fHp.formatToParts(dt).forEach(p=>{if(p.type==='year'||p.type==='month'||p.type==='day')o[p.type]=parseInt(p.value,10)});return o}
function h2g(y,m,d){if(!fHp)return null;let t=new Date(622,6,16,12);t.setDate(t.getDate()+Math.round((y-1)*354.367+(m-1)*29.5306+(d-1)));for(let i=0;i<25;i++){const h=g2h(t);if(h.year===y&&h.month===m&&h.day===d)return t;const df=(y-h.year)*354.367+(m-h.month)*29.5306+(d-h.day);t.setDate(t.getDate()+(Math.abs(df)<1.5?Math.sign(df):Math.round(df)))}return null}
function vConv(){
  const t=new Date(),h=g2h(t);AFTER.push(cvUpdate);
  return head('تحويل التاريخ')+`<div class="cvgrid">
  <section class="card"><h3>من هجري إلى ميلادي</h3><div class="form"><div class="fld"><label for="cvHd">اليوم</label><select id="cvHd" data-cv="1">${[...Array(30)].map((_,i)=>`<option value="${i+1}" ${i+1===h.day?'selected':''}>${i+1}</option>`).join('')}</select></div><div class="fld"><label for="cvHm">الشهر</label><select id="cvHm" data-cv="1">${HMON.map((n,i)=>`<option value="${i+1}" ${i+1===h.month?'selected':''}>${i+1} – ${n}</option>`).join('')}</select></div><div class="fld full"><label for="cvHy">السنة الهجرية</label><input id="cvHy" type="number" inputmode="numeric" min="1300" max="1600" value="${h.year}" data-cv="1"></div></div><div class="cvres" id="cvHres"></div></section>
  <section class="card"><h3>من ميلادي إلى هجري</h3><div class="form"><div class="fld full"><label for="cvG">التاريخ الميلادي</label><input id="cvG" type="date" value="${iso(t)}" data-cv="1"></div></div><div class="cvres" id="cvGres"></div></section></div>
  <div class="row"><button class="btn line" data-act="cvToday">↺ تاريخ اليوم</button><span class="muted small">التحويل وفق تقويم أم القرى.</span></div>`;
}
function cvUpdate(){
  const hr=$('#cvHres'),gr=$('#cvGres');if(!hr||!gr)return;
  const hy=+$('#cvHy').value,hm=+$('#cvHm').value,hd=+$('#cvHd').value;
  if(!fHp)hr.innerHTML='<span class="muted">المتصفح لا يدعم التقويم الهجري</span>';
  else if(!(hy>=1300&&hy<=1600))hr.innerHTML='<span class="muted">أدخل سنة هجرية بين 1300 و1600</span>';
  else{const g=h2g(hy,hm,hd);hr.innerHTML=g?`<small>${fDay.format(g)}</small><b>${fG.format(g)} م</b><span class="muted small">${greg(iso(g))}</span>`:`<span class="st no">شهر ${HMON[hm-1]} ${hy} هـ ${hd===30?'29 يوماً فقط':'تاريخ غير صالح'}</span>`}
  const v=$('#cvG').value;
  if(!v)gr.innerHTML='<span class="muted">اختر تاريخاً ميلادياً</span>';
  else{const d=parse(v);d.setHours(12);gr.innerHTML=`<small>${fDay.format(d)}</small><b>${fH.format(d)}</b><span class="muted small">${hij(v)} هـ</span>`}
}

    case 'lines':return `<div class="fld full">${lab}<textarea id="${id}" rows="5">${esc((v||[]).join('\n'))}</textarea></div>`;
    case 'date':return `<div class="fld">${lab}<input class="dtx" id="${id}_t" data-dfor="${id}" inputmode="numeric" autocomplete="off" placeholder="اكتب: 1448/6/1 أو 2026/11/14" value="${v?esc(v.replace(/-/g,'/')):''}"><div class="row" style="gap:6px"><input type="date" id="${id}" value="${esc(v)}" style="flex:1" title="أو اختر من التقويم"></div><small class="muted" id="${id}_h">${v?dualDate(v):'يمكنك الكتابة بالهجري أو الميلادي، أو الاختيار من التقويم'}</small></div>`;

    case 'level':return `<div class="fld">${lab}<select id="${id}"><option value="">—</option>${LEVELS.map(([a,b])=>`<option value="${a}" ${v!==''&&+v===a?'selected':''}>${b}</option>`).join('')}</select></div>`;
    case 'select':{const o=optList(f.opts);const has=o.some(x=>(Array.isArray(x)?x[0]:x)==v);return `<div class="fld">${lab}<select id="${id}"><option value="">—</option>${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return `<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`}).join('')}${!has&&v?`<option selected value="${esc(v)}">${esc(v)}</option>`:''}</select></div>`}

    default:return `<div class="fld ${f.full?'full':''}">${lab}<input id="${id}" value="${esc(v)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}></div>`;
  }

function daysBetween(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function periodState(from,to,status){if(!from)return '—';const t=todayISO(),len=daysBetween(from,to)+1;
  if(t<from){const n=daysBetween(t,from);return `<span class="st na">لم يبدأ</span><div class="small muted">يبدأ ${n===1?'غداً':'بعد '+n+' أيام'} · المدة ${len} ${len===1?'يوم':'أيام'}</div>`}
  if(t<=to){const n=daysBetween(t,to);return status==='نفذ'?`<span class="st ok">نُفّذ ضمن المدة</span>`:`<span class="st warn">جارٍ التنفيذ</span><div class="small muted">${n===0?'اليوم آخر يوم':'متبقٍ '+n+(n===1?' يوم':' أيام')} · من ${len}</div>`}
  return status==='نفذ'?`<span class="st ok">انتهت المدة · نُفّذ</span>`:`<span class="st no">انتهت المدة</span><div class="small muted">منذ ${daysBetween(to,t)} ${daysBetween(to,t)===1?'يوم':'أيام'}</div>`}
function dualDate(v){return `${dayName(v)} · ${greg(v)} م · ${hij(v)} هـ`}
function parseTyped(txt){
  const p=String(txt).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).split(/[\/\-\.\s]+/).filter(Boolean).map(Number);
  if(p.length!==3||p.some(isNaN))return null;
  let y,m,d;if(p[0]>=1000){[y,m,d]=p}else if(p[2]>=1000){[d,m,y]=p}else return null;
  if(m<1||m>12||d<1||d>31)return null;
  if(y<1700){const g=typeof h2g==='function'?h2g(y,m,d):null;return g?iso(g):null}
  const g=new Date(y,m-1,d);if(g.getMonth()!==m-1)return null;return iso(g);
}
document.addEventListener('input',e=>{const t=e.target;

function drawDisCharts(d,ds,rows,res){
  if(typeof Chart==='undefined'){document.querySelectorAll('.chartbox').forEach(b=>b.innerHTML='<div class="empty small">تعذّر تحميل مكتبة الرسوم البيانية</div>');return}
  Chart.defaults.font.family='Tajawal, system-ui, sans-serif';Chart.defaults.color='#66756f';
  const P='#14806a',G='#b8913a',R='#c0392b';
  const mk=(id,cfg)=>{const el=document.getElementById(id);if(el)charts.push(new Chart(el,cfg))};
  const dayStats=dt=>{const a=agg([dt]),s=sumAgg(a);return {rate:s.rate,late:a.reduce((x,r)=>x+r.lt,0)}};
  const recDays=Object.keys(D.dis_days).filter(x=>x<=d).sort().slice(-12);
  const opt2={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}},scales:{y:{position:'right',min:0,max:100,title:{display:true,text:'الحضور %'}},y1:{position:'left',beginAtZero:true,grid:{display:false},title:{display:true,text:'المتأخرون'}}}};
  const ser=list=>({labels:list.map(x=>x.l),datasets:[{type:'line',label:'نسبة الحضور %',data:list.map(x=>x.rate==null?null:Math.round(x.rate*10)/10),borderColor:P,backgroundColor:P,tension:.3,yAxisID:'y',spanGaps:true},{type:'bar',label:'عدد المتأخرين',data:list.map(x=>x.late),backgroundColor:'rgba(184,145,58,.55)',yAxisID:'y1',borderRadius:4}]});
  mk('chDaily',{data:ser(recDays.map(x=>{const s=dayStats(x);return {l:dayName(x).replace('ال','')+' '+greg(x).slice(0,5),...s}})),options:opt2});
  const wk=[];for(let i=7;i>=0;i--){const w=weekDates(addDays(d,-7*i)),a=agg(w),s=sumAgg(a);wk.push({l:'أسبوع '+greg(w[0]).slice(0,5),rate:s.rate,late:a.reduce((x,r)=>x+r.lt,0)})}
  mk('chWeekly',{data:ser(wk),options:opt2});
  const mo=[];const base=parse(d);for(let i=5;i>=0;i--){const m=new Date(base.getFullYear(),base.getMonth()-i,1),md=monthDates(iso(m)),a=agg(md),s=sumAgg(a);mo.push({l:fMon.format(m),rate:s.rate,late:a.reduce((x,r)=>x+r.lt,0)})}
  mk('chMonthly',{data:ser(mo),options:opt2});
  const cr=rows.slice().sort((a,b)=>(100-b.rate)-(100-a.rate));
  mk('chClasses',{type:'bar',data:{labels:cr.map(r=>cname(r.c)),datasets:[{label:'نسبة الغياب %',data:cr.map(r=>Math.round((100-r.rate)*10)/10),backgroundColor:R,borderRadius:4},{label:'نسبة التأخر %',data:cr.map(r=>Math.round(r.lateRate*10)/10),backgroundColor:G,borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{beginAtZero:true}}}});
  const rk=Object.keys(res);if(rk.length)mk('chRes',{type:'bar',data:{labels:rk,datasets:[{label:'نتائج الاتصال',data:rk.map(k=>res[k]),backgroundColor:P,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
}

const nLab=n=>(n.code?n.code+' – ':'')+String(n.text||n.name||'').replace(/\s+/g,' ').trim().slice(0,70);
function targetsAt(T,depth){const out=[];sortO(vals(T.coll)).forEach(dom=>{if(depth<0){out.push({d:dom.id,path:[],label:'المجال: '+dom.name});return}
  const walk=(node,lvl,path,lab)=>(node[T.levels[lvl].key]||[]).forEach(ch=>{const pp=path.concat(ch.id),l=lab+' › '+T.levels[lvl].label+': '+nLab(ch);if(lvl===depth)out.push({d:dom.id,path:pp,label:l});else walk(ch,lvl+1,pp,l)});
  walk(dom,0,[],dom.name)});return out}
const samePath=(a,b)=>a.join('.')===b.join('.');
function locLabel(T,dId,path){const dom=D[T.coll][dId];let l=dom?dom.name:'';let n=dom;path.forEach((id,i)=>{n=(n[T.levels[i].key]||[]).find(x=>x.id===id)||{};l+=' › '+T.levels[i].label+': '+nLab(n)});return l}

  <p class="small muted">ينتقل العنصر بكل ما تحته من عناصر وبرامج وشواهد، ويُضاف في آخر المكان الجديد.</p>`,
  `<button class="btn" data-act="mvGo">نقل</button><button class="btn line" data-act="mClose">إلغاء</button>`,
  {targets,onPick,mount:()=>{const q=$('#mvQ'),sel=$('#mvSel');q.addEventListener('input',()=>{const v=normAr(q.value.trim());[...sel.options].forEach(o=>{o.hidden=!!v&&!normAr(o.textContent).includes(v)})})}});
}
function moveNode(T,dId,pth){
  const l=pth.length-1,lv=T.levels[l],node=getNode(D[T.coll][dId],T,pth);if(!node)return;
  const cur=pth.slice(0,-1),targets=targetsAt(T,l-1).filter(t=>!(t.d===dId&&samePath(t.path,cur)));
  moveModal('نقل '+lv.label,lv.label+': '+nLab(node),locLabel(T,dId,cur)||D[T.coll][dId].name,targets,t=>{
    const key=lv.key,src=clone(D[T.coll][dId]),par=l===0?src:getNode(src,T,cur),i=(par[key]||[]).findIndex(x=>x.id===pth[l]);if(i<0)return;const [nd]=par[key].splice(i,1);
    if(t.d===dId){const tp=t.path.length?getNode(src,T,t.path):src;(tp[key]=tp[key]||[]).push(nd);put(T.coll,dId,src)}
    else{const dst=clone(D[T.coll][t.d]),tp=t.path.length?getNode(dst,T,t.path):dst;(tp[key]=tp[key]||[]).push(nd);put(T.coll,t.d,dst);put(T.coll,dId,src);UI.open[t.d]=true}
    toast('تم نقل '+lv.label+' ✔')});
}
function moveProg(T,dId,pth,x){
  const n=getNode(D[T.coll][dId],T,pth),pr=n&&(n.programs||[]).find(q=>q.id===x);if(!pr)return;
  const targets=targetsAt(T,T.levels.length-1).filter(t=>!(t.d===dId&&samePath(t.path,pth)));
  moveModal('نقل '+T.progLabel,pr.name,locLabel(T,dId,pth),targets,t=>{
    const src=clone(D[T.coll][dId]),sn=getNode(src,T,pth),i=sn.programs.findIndex(q=>q.id===x);if(i<0)return;const [pg]=sn.programs.splice(i,1);
    if(t.d===dId){const tn=getNode(src,T,t.path);(tn.programs=tn.programs||[]).push(pg);put(T.coll,dId,src)}
    else{const dst=clone(D[T.coll][t.d]),tn=getNode(dst,T,t.path);(tn.programs=tn.programs||[]).push(pg);put(T.coll,t.d,dst);put(T.coll,dId,src);UI.open[t.d]=true}

/* ============ مطابقة التعاميم مع الخطط ============ */
const normAr=s=>String(s||'').replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^ء-يa-zA-Z0-9\s]/g,' ');
const AR_STOP=new Set(['في','من','علي','الي','عن','مع','او','ام','ثم','بشان','حول','بخصوص','برنامج','برامج','تعميم','تعاميم','عام','لعام','للعام','عامه','تنفيذ','اقامه','تفعيل','بدء','حيال','مدارس','مدرسه','وزاره','اداره','تعليم','هذا','هذه','ذلك','التي','الذي','جميع','كافه','لجميع','خلال','بعد','قبل','ضمن','فصل','دراسي','دراسيه','1446','1447','1448','1449','1450','2025','2026','2027','هـ','ه'].map(normAr));
function arToks(s){return [...new Set(normAr(s).split(/\s+/).map(w=>w.replace(/^و(?=ال|لل)/,'').replace(/^لل(.+)$/,(m,r)=>r.length>=3?r:'ل'+r).replace(/^(بال|كال|فال|ال)/,'').replace(/^و(?=.{4,})/,'')).filter(w=>w.length>=2&&!AR_STOP.has(w)&&!/^\d+$/.test(w)))]}
const tokEq=(a,b)=>a===b||(Math.min(a.length,b.length)>=3&&(a.startsWith(b)||b.startsWith(a)));
function simScore(a,b){const A=arToks(a),B=arToks(b);if(!A.length||!B.length)return {s:0,m:[]};const m=B.filter(x=>A.some(y=>tokEq(x,y)));const sm=Math.min(A.length,B.length);let sc=m.length/sm;if(m.length===1&&(sm>1&&Math.max(A.length,B.length)>2||m[0].length<4))sc=Math.min(sc,.45);return {s:sc,m}}
function circMatch(cid,manual){
  const c=D.circulars[cid];if(!c||!can('circ'))return;
  const text=(c.title||'')+' '+(c.required||'');
  const res=allItems().filter(x=>x.ref&&x.ref.t).map(x=>{const a=simScore(c.title,x.name),b=simScore(text,x.name);const r=a.s>=b.s?a:b;return Object.assign(x,{sc:r.s,mt:r.m})}).filter(x=>x.sc>=.5).sort((a,b)=>b.sc-a.sc).slice(0,6);
  if(!res.length){if(manual)toast('لم يُعثر على برنامج مطابق في الخطة التشغيلية أو خطة التحسين');return}
  const cf=c.from||c.date,ct=c.to||c.from||c.date;
  const rows=res.map((x,i)=>{const p=getItemObj(x.ref)||{};const linked=p.circ&&p.circ.id===cid;
    const dd=cf&&(p.from!==cf||(p.to||p.from)!==ct),od=c.owner&&String(p.owner||'').trim()!==String(c.owner).trim();
    return `<div class="card" style="padding:12px;margin-bottom:10px"><label class="chk" style="font-weight:800"><input type="checkbox" id="cm${i}" ${i===0?'checked':''}> ${esc(x.name)}</label>
    <div class="small muted" style="margin:2px 0 6px">${esc(x.src)} · ${esc(x.ctx||'')} · تطابق ${Math.round(x.sc*100)}% <span class="muted">(${x.mt.map(esc).join('، ')})</span>${linked?' · <b style="color:var(--ok)">مرتبط بهذا التعميم</b>':''}</div>
    ${dd?`<label class="chk small"><input type="checkbox" id="cmd${i}" checked> تحديث تاريخ التنفيذ: <s class="muted">${range(p.from,p.to||p.from)}</s> ← <b>${range(cf,ct)}</b></label>`:''}

function printable(title,inner,fname,wide){
  const html=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Tahoma,Arial,sans-serif;margin:24px;color:#1b2a27}h2{color:#0e5a4b}table{border-collapse:collapse;width:100%;font-size:13px;margin-top:10px}th,td{border:1px solid #9fb3ad;padding:6px 8px;text-align:right}th{background:#e6f2ef}.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{border:1px solid #ccd;border-radius:8px;padding:6px 12px}.kpi small{display:block;color:#666}.small,.muted{color:#667;font-size:12px}.foot{margin-top:30px;font-size:12px;color:#667}@media print{button{display:none}}</style></head><body>${inner}<div class="foot">صدر من منصة إنجاز – ${fG.format(new Date())} م / ${fH.format(new Date())}</div><button onclick="print()" style="margin-top:16px;padding:8px 18px">طباعة</button></body></html>`;
  openModal(title,`<div class="report">${inner}</div>`,`<button class="btn" data-act="dlNow">⬇ تنزيل الملف للطباعة</button><button class="btn line" data-act="mClose">إغلاق</button>`,{dl:{name:fname+'.html',html}});
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t,e)}});
document.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.cv){cvUpdate();return}if(t.dataset.chg==='dCell'){const dt=UI.ddate||todayISO(),o=dayObj(dt);o.classes=o.classes||{};const x=o.classes[t.dataset.c]||{};x[t.dataset.f]=t.value===''?'':Math.max(0,+t.value);o.classes[t.dataset.c]=x;putQuiet('dis_days',dt,o)}});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.matches('[data-evfile]')){for(const f of t.files)await addEvFile(f,t.dataset.evfile);t.value='';drawEv();return}
  if(t.matches('[data-import]')){const f=t.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app==='enjaz-files'){NOLOG=true;let n=0,m=0;for(const [id,fo] of Object.entries(j.files||{})){await putFile(id,fo);n++}
      const conv=x=>{let ch=false;const w=o=>{if(Array.isArray(o)){o.forEach(w);return}if(o&&typeof o==='object'){if(o.kind==='asset'&&j.files[o.ref]){o.kind='inline';ch=true}Object.values(o).forEach(w)}};w(x);return ch};
      for(const c of COLLS){for(const [id,o] of Object.entries(D[c]||{})){const cp=clone(o);if(conv(cp)){put(c,id,cp);m++}}}NOLOG=false;logOp('import','settings','backup',{},null);toast('نُقلت '+n+' ملفات شواهد، وحُدّث '+m+' سجلاً');t.value='';return}
if(j.app!=='enjaz')throw 0;let n=0;NOLOG=true;for(const c of COLLS){for(const [id,o] of Object.entries(j.data[c]||{})){n++;put(c,id,o)}}NOLOG=false;logOp('import','settings','backup',{},null);toast('تمت الاستعادة')}catch(err){NOLOG=false;toast('ملف النسخة غير صالح')}t.value='';return}
  if(t.dataset.cv){cvUpdate();return}
  const k=t.dataset.chg;if(!k)return;
  if(k==='dCell'){scheduleRender();return}
  if(k==='tflt'){UI.f[t.dataset.k]=t.value}
  if(k==='tonly')UI.tonly=t.checked;
  if(k==='upN')UI.up=+t.value;
  if(k==='owner')UI.owner=t.value;
  if(k==='achQ')UI.achQ=t.value;
  if(k==='achS')UI.achS=t.value;
  if(k==='logA')UI.logA=t.value;if(k==='logS')UI.logS=t.value;if(k==='logD')UI.logD=t.value;if(k==='logQ')UI.logQ=t.value;
  if(k==='ef')UI.ef=t.value;
  if(k==='esrc')UI.esrc=t.value;
  if(k==='ddate')UI.ddate=t.value||todayISO();
  if(k==='per')UI.per=t.value;
  if(k==='pdate')UI.pdate=t.value||todayISO();
  if(k==='scope'){UI.scope=t.value;UI.scopeV=''}
  if(k==='scopeV')UI.scopeV=t.value;
  if(k==='perm'){const s=clone(S());s.perms=clone(s.perms||DEFPERMS);const a=new Set(s.perms[t.dataset.r]||DEFPERMS[t.dataset.r]||[]);t.checked?a.add(t.dataset.m):a.delete(t.dataset.m);s.perms[t.dataset.r]=[...a];put('settings','main',s);return}
  render();
});

/* ============ التشغيل ============ */
async function boot(){
  if(window.ENJAZ_WEB){await window.ENJAZ_READY;const pr=(window.ENJAZ_AUTH||{}).profile||{};ME=pr.role||null;ME_STAFF=pr.staffId||null}
  else try{ME=sessionStorage.getItem('enjaz_me')||null;if(ME&&ME.startsWith('staff:')){ME_STAFF=ME.slice(6);ME='staff'}}catch(e){}
  setDot('');render();
  let cl=null;for(let i=0;i<30&&!cl;i++){if(window.claude&&typeof window.claude.use==='function')cl=window.claude;else await new Promise(r=>setTimeout(r,100))}
  if(cl){try{DB=await Promise.race([cl.use('db'),new Promise(r=>setTimeout(()=>r(null),10000))])}catch(e){DB=null}}
  if(DB){
    MODE='db';setDot('');let first=0;const tm=setTimeout(()=>{if(first<COLLS.length)toast('الاتصال بطيء؛ قد لا تظهر أحدث البيانات بعد')},10000);
    COLLS.forEach(c=>{let got=false;DB.collection(c).onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});D[c]=m;if(!got&&!s.metadata.fromCache){got=true;if(++first===COLLS.length){clearTimeout(tm);setDot('ok')}}scheduleRender()},err=>{console.warn(c,err);setDot('err')})});
    setTimeout(()=>{if(first>0)setDot('ok')},4000);
    try{ASSETS=await cl.use('assets')}catch(e){}
    try{USER=await cl.use('user');if(USER)MYUID=await USER.id()}catch(e){}
  }else{MODE='local';lsLoad();setDot('local');render()}
  if(cl){try{DL=await cl.use('downloads')}catch(e){}}
  if(ME&&ME!=='principal'&&!(S().pins||{})[ME]){}
}
boot();
